"A DDoS (Distributed Denial of Service) is an attack that overwhelms or disables a service to prevent the service from operating normally. Packets from multiple devices that disable a server would be an example of a DDoS attack."]}, {"id": "A45", "exam": "A", "question": "A data breach has occurred in a large insurance company. A security administrator is building new servers and security systems to get all of the financial systems back online. Which part of the incident response process would BEST describe these actions?", "options": ["Lessons learned                                         Quick", "Containment", "Recovery", "Analysis"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "The recovery after a breach can be a phased approach that may take months to complete.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Once the event is over, it’s useful to revisit the process to learn and improve for next time.", "During an incident, it’s useful to separate infected systems from the rest of the network.", "The recovery after a breach can be a phased approach that may take months to complete.", "The analysis phase can include the analysis of log files and alerts. These data source can help warn of a potential attack or evidence an attack is underway."]}, {"id": "A46", "exam": "A", "question": "A network team has installed new access points to support an application launch. In less than 24 hours, the wireless network was attacked and private company information was accessed. Which of the following would be the MOST likely reason for this breach?", "options": ["Race condition                                            Quick", "Jailbreaking", "Impersonation                                             The Details: 84", "Misconfiguration ❍ D. Misconfiguration"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "There are many different configuration options when installing an access point, and it's likely one of those options allowed an attacker to gain access to the internal network.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A race condition occurs when two different application processes are executing simultaneously. If the two processes are not aware of each other, the application may have unexpected results. In this example, there's no evidence the access points were experiencing a race condition.", "Jailbreaking replaces the firmware on a mobile device to gain access to features not normally available in the operating system. Jailbreaking is not commonly associated with wireless access points.", "Impersonation is an attacker pretending to be someone or something they are not. In this example, there's no evidence that impersonation was used to breach the wireless network.", "There are many different configuration options when installing an access point, and it's likely one of those options allowed an attacker to gain access to the internal network."]}, {"id": "A47", "exam": "A", "question": "An organization has identified a significant vulnerability in an Internet-facing firewall. The firewall company has stated the firewall is no longer available for sale and there are no plans to create a patch for this vulnerability. Which of the following would BEST describe this issue?", "options": ["End-of-life                                               Quick", "Improper input handling", "Improper key management                                   The Details: 85", "Incompatible OS"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "Because the firewall is no longer available for sale, the firewall company has decided to stop supporting and updating the device. A product no longer supported by the manufacturer is consider to be end-of-life.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Because the firewall is no longer available for sale, the firewall company has decided to stop supporting and updating the device. A product no longer supported by the manufacturer is consider to be end-of-life.", "A best practice for application security is to provide the proper handling of invalid or unnecessary input. A missing patch for the firewall firmware would not be related to input handling.", "Cryptographic keys can be used for many security purposes, but managing those keys isn’t part of the patching process from a vendor.", "The operating system in the firewall would normally be supported by the manufacturer, and the operating systems are not commonly modified on a purpose-built device such as a firewall."]}, {"id": "A48", "exam": "A", "question": "A company has decided to perform a disaster recovery exercise during an annual meeting with the IT directors and senior directors. A simulated disaster will be presented, and the participants will discuss the logistics and processes required to resolve the disaster. Which of the following would BEST describe this exercise?", "options": ["Capacity planning                                         Quick", "Business impact analysis", "Continuity of operations                                  The Details: 86", "Tabletop exercise ❍ D. Tabletop exercise"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "A tabletop exercise allows a disaster recovery team to evaluate and plan disaster recovery processes without performing a full-scale drill.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Capacity planning is used to determine how many resources would be required for a particular task. A formal tabletop exercise would not commonly include a capacity planning analysis.", "A business impact analysis is usually created during the disaster recovery planning process. Once the disaster has occurred, it becomes much more difficult to complete an accurate impact analysis.", "If an outage occurs, it's common to have a backup plan to provide continuity of operations. This plan can be used for any significant outage and is not specific to disaster recovery testing.", "A tabletop exercise allows a disaster recovery team to evaluate and plan disaster recovery processes without performing a full-scale drill."]}, {"id": "A49", "exam": "A", "question": "A security administrator needs to block users from visiting websites hosting malicious software. Which of the following would be the BEST way to control this access?", "options": ["Honeynet                                             Quick", "Data masking", "DNS filtering", "Data loss prevention"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "DNS filtering uses a database of known malicious websites to resolve an incorrect or null IP address. If a user attempts to visit a known malicious site, the DNS resolution will fail and the user will not be able to visit the website.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A honeynet is a non-production network created to attract attackers. A honeynet is not used to block traffic to known malicious Internet sites.", "Data masking provides a way to hide data by substitution, shuffling, encryption, and other methods. Data masking does not provide a method of blocking communication to malicious websites.", "DNS filtering uses a database of known malicious websites to resolve an incorrect or null IP address. If a user attempts to visit a known malicious site, the DNS resolution will fail and the user will not be able to visit the website.", "Data Loss Prevention (DLP) systems can identify and block private information from being transferred between systems. DLP does not provide any direct method of blocking network traffic to known malware repositories."]}, {"id": "A50", "exam": "A", "question": "A system administrator has been called to a system with a malware infection. As part of the incident response process, the administrator has imaged the operating system to a known-good version. Which of these incident response steps is the administrator following?", "options": ["Lessons learned                                      Quick", "Recovery                                             Answer: 33", "Detection                                            The Details: 88 ❍ C. Detection                                            The Details: 88", "Containment"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "The recovery phase describes the process of returning the system and data to the state prior to the malware infection. With a malware infection, this often requires deleting all data and reinstalling a known-good operating system.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A post-incident meeting can help the incident response participants discuss the phases of the incident that went well and which processes can be improved for future events.", "The recovery phase describes the process of returning the system and data to the state prior to the malware infection. With a malware infection, this often requires deleting all data and reinstalling a known-good operating system.", "The detection of the malware is an early phase in the incident response process. If the administrator is imaging a system, the malware was previously detected and any critical documents were already recovered.", "The containment phase isolates the system from any other devices to prevent the spread of any malicious software. The containment phase generally occurs immediately after"]}, {"id": "A51", "exam": "A", "question": "A company has placed a SCADA system on a segmented network with limited access from the rest of the corporate network. Which of the following would describe this process?", "options": ["Load balancing                                       Quick", "Least privilege", "Data retention                                       The Details: 89", "Hardening ❍ D. Hardening"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "The hardening process for an industrial SCADA (Supervisory Control and Data Acquisition) system might include network segmentation, additional firewall controls, and the implementation of access control lists.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A load balancer is used to distribute transactions across multiple systems. A single system was the only device referenced in this question, so a load balancing option would not be available.", "Least privilege defines the minimum rights and permissions for completing a specific task. In this example, there was no mention of specific tasks or their necessary permissions.", "Data retention is important for long-term storage of important information. In this example, the mandated storage of data was not a consideration.", "The hardening process for an industrial SCADA (Supervisory Control and Data Acquisition) system might include network segmentation, additional firewall controls, and the implementation of access control lists."]}, {"id": "A52", "exam": "A", "question": "An administrator is viewing the following security log: Dec 30 08:40:03 web01 Failed password for root from 10.101.88.230 port 26244 ssh2  Dec 30 08:40:05 web01 Failed password for root from 10.101.88.230 port 26244 ssh2  Dec 30 08:40:09 web01 445 more authentication failures; rhost=10.101.88.230 user=root  Which of the following would describe this attack?", "options": ["Spraying                                             Quick", "Downgrade                                            Answer: 33", "Brute force                                          The Details: 90 ❍ C. Brute force                                          The Details: 90", "DDoS"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "A brute force attack discovers password by attempting a large combination of letters, numbers, and special characters until a match is found. In this example, the notification of over four hundred attempts would qualify as a brute force attack.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A spraying attack is similar to a brute force attack, but spraying limits the number of attempts to prevent alerts or an account lockout. A spraying attack often uses accounts passwords stolen from other sites or a short list of the most common passwords.", "A downgrade attack is often used to force an insecure encryption algorithm or the disabling of encryption entirely. In this example, no evidence of a downgrade attack is contained in the security log.", "A brute force attack discovers password by attempting a large combination of letters, numbers, and special characters until a match is found. In this example, the notification of over four hundred attempts would qualify as a brute force attack.", "A DDoS (Distributed Denial of Service) would involve many different devices to cause a system outage. In this example, a single IP address was logged and there was no evidence of a service outage."]}, {"id": "A53", "exam": "A", "question": "During a morning login process, a user's laptop was moved to a private VLAN and a series of updates were automatically installed. Which of the following would describe this process?", "options": ["Account lockout                                      Quick", "Configuration enforcement", "Decommissioning                                      The Details: 91", "Sideloading"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "Many organizations will perform a posture assessment during the login process to verify the proper security controls are in place. If the device does not pass the assessment, the system can be quarantined and any missing security updates can then be installed.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["In this example, there were no errors or notifications regarding the account or authentication status.", "Many organizations will perform a posture assessment during the login process to verify the proper security controls are in place. If the device does not pass the assessment, the system can be quarantined and any missing security updates can then be installed.", "The decommissioning process is often used to permanently remove devices from the network. In this example, the laptop mitigation would allow the device to return to the network once the updates were complete.", "Sideloading describes the installation of software on a mobile device through the use of third-party operating systems or websites."]}, {"id": "A54", "exam": "A", "question": "Which of the following describes two-factor authentication? Quick", "options": ["A printer uses a password and a PIN                Answer: 33", "The door to a building requires a fingerprint scan", "An application requires a pseudo-random code", "A Windows Domain requires a password and smart card"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": " on attempts."]}, {"id": "A57", "exam": "A", "question": "A manufacturing company would like to track the progress of parts used on an assembly line. Which of the following technologies would be the BEST choice for this task?", "options": ["Secure enclave                                        Quick", "Blockchain", "Hashing                                               The Details: 95", "Asymmetric encryption ❍ D. Asymmetric encryption"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "The ledger functionality of a blockchain can be used to track or verify components, digital media, votes, and other physical or digital objects.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A secure enclave is a protected area for secret information, and the secure enclave is often implemented as a hardware processor in a device.", "The ledger functionality of a blockchain can be used to track or verify components, digital media, votes, and other physical or digital objects.", "Cryptographic hashes are commonly used to provide integrity verifications, but they don't necessarily include any method of tracking components on an assembly line.", "Asymmetric encryption uses different keys for encryption and decryption. Asymmetric encryption does not provide any method for tracking objects on an assembly line."]}, {"id": "A58", "exam": "A", "question": "A company's website has been compromised and the website content has been replaced with a political message. Which of the following threat actors would be the MOST likely culprit?", "options": ["Insider                                                Quick", "Organized crime", "Shadow IT", "Hacktivist"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "A hacktivist is motivated by a particular philosophy, and their goal is to spread their message by defacing web sites and releasing private documents.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["An insider has access to many company services, but the motivations of an insider threat would not commonly result in the posting of political information.", "Organized crime actors are motivated by money. It would be unusual for an organized crime hack to include the posting of political messages.", "A shadow IT group is mostly interested in building their own systems and applications, and they would not commonly deface a website in an attempt to spread a specific political message.", "A hacktivist is motivated by a particular philosophy, and their goal is to spread their message by defacing web sites and releasing private documents."]}, {"id": "A59", "exam": "A", "question": "A Linux administrator is downloading an updated version of her Linux distribution. The download site shows a link to the ISO and a SHA256 hash value. Which of these would describe the use of this hash value?", "options": ["Verifies that the file was not corrupted during        Quick the file transfer                                      Answer: 33", "Provides a key for decrypting the ISO                  The Details: 97 ❍ B. Provides a key for decrypting the ISO                  The Details: 97 after download", "Authenticates the site as an official ISO distribution site", "Confirms that the file does not contain any malware"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "the file transfer Once the file is downloaded, the administrator can calculate the file’s SHA256 hash and confirm that it matches the value on the website.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["the file transfer Once the file is downloaded, the administrator can calculate the file’s SHA256 hash and confirm that it matches the value on the website.", "ISO files containing public information are usually distributed without any encryption, and a hash value would not commonly be used as a decryption key.", "Although it’s important to download files from known good sites, providing a hash value on a site would not provide any information about the site’s authentication.", "A hash value doesn’t inherently provide any protection against malware."]}, {"id": "A60", "exam": "A", "question": "A company's security policy requires that login access should only be available if a person is physically within the same building as the server. Which of the following would be the BEST way to provide this requirement?", "options": ["USB security key                                       Quick", "Biometric scanner", "PIN", "SMS"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "A biometric scanner would require a person to be physically present to verify the authentication.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A security key can be used to store a certificate on a USB (Universal Serial Bus) drive. The security key is commonly used as an authentication method for a user or application, and it doesn't provide any information about the location of the security key.", "A biometric scanner would require a person to be physically present to verify the authentication.", "Although a PIN (Personal Identification Number) can be used as an authentication factor, the use of the PIN does not guarantee that a person is physically present.", "SMS (Short Message Service), or text messages, are commonly used as authentication factors. However, the use of a mobile device to receive the SMS message does not guarantee that the owner of the mobile device is physically present."]}, {"id": "A61", "exam": "A", "question": "A development team has installed a new application and database to a cloud service. After running a vulnerability scanner on the application instance, a security administrator finds the database is available for anyone to query without providing any authentication. Which of these vulnerabilities is MOST associated with this issue?", "options": ["Legacy software                                         Quick", "Open permissions", "Race condition                                          The Details: 99", "Malicious update ❍ D. Malicious update"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "Just like local systems, proper permissions and security controls are required when applications are installed to a cloud-based system. If permissions are not properly configured, the application data may be accessible by anyone on the Internet.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Legacy software often describes an older application with limited support options. The application and database in this example is a new installation and would not normally be categorized as legacy.", "Just like local systems, proper permissions and security controls are required when applications are installed to a cloud-based system. If permissions are not properly configured, the application data may be accessible by anyone on the Internet.", "If two processes occur simultaneously without coordination between the processes, unexpected results could occur. In this example, a single vulnerability scan has identified the issue and other processes do not appear to be involved.", "A malicious update involves the installation of unwanted software during a normal update process. In this example, an update was not performed and the resulting public access would not generally be ons": ["Transfer                                                Quick", "Mitigate", "Accept", "Avoid"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "Mitigation is a strategy that decreases the threat level. This is commonly done through the use of additional security systems and monitoring, such as an NGFW (Next-Generation Firewall).", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Transferring risk would move the risk from one entity to another. Adding an NGFW would not transfer any risk to another party.", "Mitigation is a strategy that decreases the threat level. This is commonly done through the use of additional security systems and monitoring, such as an NGFW (Next-Generation Firewall).", "The acceptance of risk is a position where the owner understands the risk and has decided to accept the potential results.", "With risk avoidance, the owner of the risk decides to stop participating in a high-risk activity. This effectively avoids the risky activity and prevents any future issues."]}, {"id": "A64", "exam": "A", "question": "An organization is implementing a security model where all application requests must be validated at a policy enforcement point. Which of the following would BEST describe this model? Quick", "options": ["Public key infrastructure", "Zero trust", "Discretionary access control", "Federation"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "Zero trust describes a model where nothing is inherently trusted and everything must be verified to gain access. A central policy enforcement point is commonly used to implement a zero trust architecture.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A public key infrastructure (PKI) uses public and private keys to provide confidentiality and integrity. Asymmetric encryption and digital signatures are used as foundational technologies in PKI.", "Zero trust describes a model where nothing is inherently trusted and everything must be verified to gain access. A central policy enforcement point is commonly used to implement a zero trust architecture.", "Discretionary access control is an authorization method where the owner of the data determines the scope and type of access. A discretionary access control model does not specifically define how the authorization is implemented.", "Federation provides a way to manage authentication to a third-party database. Federation does not describe the use of a policy enforcement point."]}, {"id": "A65", "exam": "A", "question": "A company is installing a new application in a public cloud. Which of the following determines the assignment of data security in this cloud infrastructure?", "options": ["Playbook                                               Quick", "Audit committee", "Responsibility matrix                                  The Details: 103", "Right-to-audit clause ❍ D. Right-to-audit clause"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "A cloud responsibility matrix is usually published by the provider to document the responsibilities for all cloud-based services. For example, the customer responsibilities for an IaaS (Infrastructure as a Service) implementation will be different than SaaS (Software as a Service).", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A playbook provides conditional steps to follow when managing an organization's processes and procedures. For example, the process of recovering from a virus infection would be documented in a playbook.", "An audit committee oversees the risk management activities for an organization. For example, the committee would be responsible for verifying the security implementation documented in the responsibility matrix.", "A cloud responsibility matrix is usually published by the provider to document the responsibilities for all cloud-based services. For example, the customer responsibilities for an IaaS (Infrastructure as a Service) implementation will be different than SaaS (Software as a Service).", "A right-to-audit clause is often included in a third-party contract to define the terms and conditions around periodic audits. This is often part of a larger product or services contract."]}, {"id": "A66", "exam": "A", "question": "When decommissioning a device, a company documents the type and size of storage drive, the amount of RAM, and any installed adapter cards. Which of the following describes this process?", "options": ["Destruction                                            Quick", "Sanitization", "Certification                                          The Details: 104", "Enumeration ❍ D. Enumeration"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "Enumeration describes the detailed listing of all parts in a particular device. For a computer, this could include the CPU type, memory, storage drive details, keyboard model, and more.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Destruction involves physically damaging a device or component to prevent any future use or data access. Although the company may choose to destroy these computers at a later date, this question does not describe the destruction process.", "Sanitization deletes data from storage media and allows the storage device to be used in the future. For example, a sector-by-sector format would sanitize a hard drive and allow the drive to be installed into another computer without the concern of a data breach.", "If a third-party is providing destruction services, they often will certify the work and document which device serial numbers were destroyed as part of their service.", "Enumeration describes the detailed listing of all parts in a particular device. For a computer, this could include the CPU type, memory, storage drive details, keyboard model, and more."]}, {"id": "A67", "exam": "A", "question": "An attacker has sent more information than expected in a single API call, and this has allowed the execution of arbitrary code. Which of the following would BEST describe this attack? Quick", "options": ["Buffer overflow                                        Answer: 33", "Replay attack", "Cross-site scripting", "DDoS"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "The results of a buffer overflow can cause random results, but sometimes the actions can be repeatable and controlled. In the best possible case for the hacker, a buffer overflow can be manipulated to execute code on the remote device.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["The results of a buffer overflow can cause random results, but sometimes the actions can be repeatable and controlled. In the best possible case for the hacker, a buffer overflow can be manipulated to execute code on the remote device.", "A replay attack does not require the sending of more information than expected, and often a replay attack consists of normal traffic and expected application input.", "A cross-site scripting attack allows a third party to take advantage of the trust a browser might have with another website. This question involves an API call and does not appear to reference a browser or third-party website.", "A DDoS (Distributed Denial of Service) renders a service unavailable, and it involves the input of many devices to operate. A DDoS would not require sending more information than expected, and it rarely results in the execution of arbitrary code."]}, {"id": "A68", "exam": "A", "question": "A company encourages users to encrypt all of their confidential materials on a central server. The organization would like to enable key escrow as a backup option. Which of these keys should the organization place into escrow?", "options": ["Private                                                Quick", "CA", "Session", "Public"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "With asymmetric encryption, the private key is used to decrypt information that has been encrypted with the public key. To ensure continued access to the encrypted data, the company must have a copy of each private key.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["With asymmetric encryption, the private key is used to decrypt information that has been encrypted with the public key. To ensure continued access to the encrypted data, the company must have a copy of each private key.", "A CA (Certificate Authority) key is commonly used to validate the digital signature from a trusted CA. This is not commonly used for user data encryption.", "Session keys are commonly used temporarily to provide confidentiality during a single session. Once the session is complete, the keys are discarded. Session keys are not used to provide long-term data encryption.", "In asymmetric encryption, a public key is already available to everyone. It would not be necessary to escrow a public key."]}, {"id": "A69", "exam": "A", "question": "A company is in the process of configuring and enabling host-based firewalls on all user devices. Which of the following threats is the company addressing?", "options": ["Default credentials                                   Quick", "Vishing", "Instant messaging                                     The Details: 107", "On-path ❍ D. On-path"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "Instant messaging is commonly used as an attack vector, and one way to help protect against malicious links delivered by instant messaging is a host-based firewall.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Users commonly login with unique credentials that are specific to the user. A host-based firewall would not identify the use of a default username and password.", "Vishing, or voice phishing, occurs over a phone or other voice communication method. A host-based firewall would not be able to protect against a voice-related attack vector.", "Instant messaging is commonly used as an attack vector, and one way to help protect against malicious links delivered by instant messaging is a host-based firewall.", "A on-path attack describes a third-party in the middle of a communications path. The victims of an on-path attack are usually not aware an attack is taking place, so a host-based firewall would not be able to detect an on-path attack."]}, {"id": "A70", "exam": "A", "question": "A manufacturing company would like to use an existing router to separate a corporate network from a manufacturing floor. Both networks use the same physical switch, and the company does not want to install any additional hardware. Which of the following would be the BEST choice for this segmentation?                 Quick Answer: 33", "options": ["Connect the corporate network and the manufacturing floor with a VPN                  The Details: 108", "Build an air gapped manufacturing floor network", "Use host-based firewalls on each device", "Create separate VLANs for the corporate network and the manufacturing floor"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "the manufacturing floor Creating VLANs (Virtual Local Area Networks) will segment a network without requiring additional switches.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["with a VPN A VPN (Virtual Private Network) would encrypt all information between the two networks, but it would not provide any segmentation. This process would also commonly require additional hardware to provide VPN connectivity.", "An air gapped network would require separate physical switches on each side of the gap, and this would require the purchase of an additional switch.", "While personal firewalls provide protection for individual devices, they do not segment networks. It’s also uncommon for personal firewalls to be installed on manufacturing equipment.", "the manufacturing floor Creating VLANs (Virtual Local Area Networks) will segment a network without requiring additional switches."]}, {"id": "A71", "exam": "A", "question": "An organization needs to provide a remote access solution for a newly deployed cloud-based application. This application is designed to be used by mobile field service technicians. Which of the following would be the best option for this requirement?", "options": ["RTOS                                                  Quick", "CRL", "Zero-trust                                            The Details: 109", "SASE ❍ D. SASE"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "A SASE (Secure Access Service Edge) solution is a next-generation VPN technology designed to optimize the process of secure communication to cloud services.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["An RTOS (Real-time Operating System) is an OS designed for industrial equipment, automobiles, and other time-sensitive applications.", "A CRL (Certificate Revocation List) is used to determine if a certificate has been administratively revoked. A CRL would not provide any remote access functionality.", "Zero-trust is a security strategy where all devices on the network are verified before connecting to another device. Zero-trust does not provide remote access functions.", "A SASE (Secure Access Service Edge) solution is a next-generation VPN technology designed to optimize the process of secure communication to cloud services."]}, {"id": "A72", "exam": "A", "question": "A company is implementing a quarterly security awareness campaign. Which of the following would MOST likely be part of this campaign?", "options": ["Suspicious message reports from users                 Quick", "An itemized statement of work", "An IaC configuration file                             The Details: 110", "An acceptable use policy document ❍ D. An acceptable use policy document"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "A security awareness campaign often involves automated phishing attempts, and most campaigns will include a process for users to report a suspected phishing attempt to the IT security team.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A security awareness campaign often involves automated phishing attempts, and most campaigns will include a process for users to report a suspected phishing attempt to the IT security team.", "A statement of work (SOW) is commonly used for service engagements. The SOW provides a list of deliverables for the professional services, and this list is often used to determine if the services were completed.", "An IaC (Infrastructure as Code) configuration file describes an infrastructure configuration commonly used by cloud-based systems. An IaC configuration file would not be used by a security awareness campaign.", "An acceptable use policy (AUP) is defined by an employer to describe the proper use of technology and systems within an organization. The AUP itself is not part of a security awareness campaign."]}, {"id": "A73", "exam": "A", "question": "A recent report shows the return of a vulnerability that was previously patched four months ago. After researching this issue, the security team has found a recent patch has reintroduced this vulnerability on the servers. Which of the following should the security administrator implement to prevent this issue from occurring in the future?", "options": ["Containerization                                      Quick", "Data masking", "802.1X", "Change management"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "The change management process includes a testing phase that can help identify potential issues relating to an application change or upgrade.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Containerization is an efficient method of deploying application instances, but it doesn't provide any mitigation for security vulnerabilities.", "Data masking can be used to limit access to sensitive data, but it does not prevent the implementation of a security vulnerability.", "802.1X is a standard for port-based network access control, and it can help manage the authentication process of network users. 802.1X does not provide any mitigation for security vulnerabilities.", "The change management process includes a testing phase that can help identify potential issues relating to an application change or upgrade."]}, {"id": "A74", "exam": "A", "question": "A security manager would like to ensure that unique hashes are used with an application login process. Which of the following would be the BEST way to add random data when generating a set of stored pass ices to provide cryptographic functions and securely store encryption keys. Individual TPMs would not provide any consolidation of web server private keys.", "A UEFI (Unified Extensible Firmware Interface) BIOS (Basic Input/ Output System) does not provide any additional security or consolidation features for web server private keys."]}, {"id": "A80", "exam": "A", "question": "A security technician is reviewing this security log from an IPS: ALERT 2023-06-01 13:07:29 [163bcf65118-179b547b] Cross-Site Scripting in JSON Data 222.43.112.74:3332 -\u003e 64.235.145.35:80 URL/index.html - Method POST - Query String \"-\" User Agent: curl/7.21.3 (i386-redhat-linux-gnu) libcurl/7.21.3 NSS/3.13.1.0 zlib/1.2.5 libidn/1.19 libssh2/1.2.7 Detail: token=\"\u003cscript\u003e\" key=\"key7\" value=\"\u003cscript\u003ealert(2)\u003c\/script\u003e\" Which of the following can be determined from this log information? (Select TWO)", "options": ["The alert was generated from a malformed User Agent header", "The alert was generated from an embedded script", "The attacker’s IP address is 222.43.112.74             Quick", "The attacker’s IP address is 64.235.145.35", "The alert was generated due to an invalid              The Details: 118 client port number"], "correctLetters": ["B", "C"], "answerIndices": [1, 2], "pdfExplanation": "C. The attacker’s IP address is 222.43.112.74 The details of the IPS (Intrusion Prevention System) alert show a script value embedded into JSON ( JavaScript Object Notation) data. The IPS log also shows the flow of the attack with an arrow in the middle. The attacker was IP address 222.43.112.74 with port 3332, and the victim was 64.235.145.35 over port 80.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["The user agent information is provided as additional supporting data associated with the alert. The agent itself is not the cause of this alert.", "C. The attacker’s IP address is 222.43.112.74 The details of the IPS (Intrusion Prevention System) alert show a script value embedded into JSON ( JavaScript Object Notation) data. The IPS log also shows the flow of the attack with an arrow in the middle. The attacker was IP address 222.43.112.74 with port 3332, and the victim was 64.235.145.35 over port 80.", "C. The attacker’s IP address is 222.43.112.74 The details of the IPS (Intrusion Prevention System) alert show a script value embedded into JSON ( JavaScript Object Notation) data. The IPS log also shows the flow of the attack with an arrow in the middle. The attacker was IP address 222.43.112.74 with port 3332, and the victim was 64.235.145.35 over port 80.", "The attacker’s IP address is listed first, so the victim's IP address is 64.235.145.35.", "The port number associated with the client, 3332, is a valid port number and not associated with the cause of the alert."]}, {"id": "A81", "exam": "A", "question": "Which of the following describes a monetary loss if one event occurs?", "options": ["ALE                                                    Quick", "SLE", "RTO                                                    The Details: 119", "ARO ❍ D. ARO"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "SLE (Single Loss Expectancy) describes the financial impact of a single event.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["ALE (Annual Loss Expectancy) is the financial loss over an entire 12-month period.", "SLE (Single Loss Expectancy) describes the financial impact of a single event.", "RTO (Recovery Time Objectives) define a timeframe needed to restore a particular service level.", "The ARO (Annualized Rate of Occurrence) is the number of times an event will occur in a 12-month period."]}, {"id": "A82", "exam": "A", "                       Quick", "Vulnerability scanner", "DDoS                                                       The Details: 128", "Penetration test ❍ D. Penetration test"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "A penetration test can be used to actively exploit potential vulnerabilities in a system or application. This could cause a denial of service or loss of data, so the best practice is to perform the penetration test during non- production hours or in a test environment.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A tabletop exercise is used to talk through a security event with an incident response team around a conference room table. This is commonly performed as a training device instead of performing a full-scale disaster drill.", "Vulnerability scanners may identify a vulnerability, but they do not actively attempt to exploit the vulnerability.", "A DDoS (Distributed Denial of Service) attack is often used to disable a service or application, but it doesn't provide any particular information regarding an application vulnerability.", "A penetration test can be used to actively exploit potential vulnerabilities in a system or application. This could cause a denial of service or loss of data, so the best practice is to perform the penetration test during non- production hours or in a test environment."]}];
const KEY='secplusExamA90_rebuilt_v1';
let state={};
try { state=JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e) { state={}; }
let order=BANK.map((_,i)=>i), pos=0, missedOnly=false, tempSel=[];

const $=id=>document.getElementById(id);
const letters='ABCDEFG';
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function save(){ try { localStorage.setItem(KEY,JSON.stringify(state)); } catch(e) {} }
function active(){
  return missedOnly ? order.filter(i=>state[BANK[i].id] && !state[BANK[i].id].correct) : order;
}
function updateStats(){
  const vals=Object.values(state), a=vals.length, c=vals.filter(x=>x.correct).length;
  $('answered').textContent=a;
  $('correct').textContent=c;
  $('missed').textContent=a-c;
  $('accuracy').textContent=a ? Math.round(c/a*100)+'%' : '0%';
  $('bar').style.width=(a/BANK.length*100)+'%';
}
function choiceText(q,L){
  const i=letters.indexOf(L);
  return i>=0 && q.options ? `${L}. ${esc(q.options[i])}` : L;
}
function render(){
  const arr=active();
  if(!arr.length){
    $('app').innerHTML='<div class="qcard"><h2>No questions to show.</h2><p>Turn off “Review missed only” or answer some questions first.</p></div>';
    updateStats(); return;
  }
  pos=Math.max(0,Math.min(pos,arr.length-1));
  const q=BANK[arr[pos]], st=state[q.id];
  let body='';

  if(q.type==='pbq'){
    body=(q.parts||[]).map((p,i)=>`
      <div class="pbqrow">
        <label>${esc(p[0])}</label>
        <select data-p="${i}" ${st?'disabled':''}>
          <option value="">Select…</option>
          ${(q.choices||[]).map(x=>`<option ${st&&st.answers&&st.answers[i]===x?'selected':''}>${esc(x)}</option>`).join('')}
        </select>
      </div>`).join('');
    if(!st) body+='<button class="primary" id="submitPBQ" type="button">Submit answer</button>';
  } else {
    const multi=(q.answerIndices||[]).length>1;
    if(multi&&!st) body+='<p class="note">Select all that apply, then click Submit answer.</p>';
    body+=(q.options||[]).map((o,i)=>{
      let cls='opt', selected=st&&st.answers.includes(i);
      if(!st&&tempSel.includes(i)) cls+=' selected';
      if(st&&selected) cls+=(q.answerIndices||[]).includes(i)?' correct':' wrong';
      else if(st&&(q.answerIndices||[]).includes(i)) cls+=' correct';
      return `<button type="button" class="${cls}" data-o="${i}" ${st?'disabled':''}><span class="letter">${letters[i]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    if(multi&&!st) body+='<button class="primary" id="submitMulti" type="button">Submit answer</button>';
  }

  let feedback='';
  if(st){
    if(q.type==='pbq'){
      feedback=`<div class="feedback"><h3>${st.correct?'Correct':'Not quite'}</h3>
        <div class="pdf"><strong>PDF answer</strong>${(q.parts||[]).map(p=>`<div class="choice"><b>${esc(p[0])}</b><br>${esc(p[1])}</div>`).join('')}</div>
        <div class="review"><strong>ChatGPT review: ${esc(q.chatgptVerdict)}</strong><p>${esc(q.chatgptReview)}</p></div></div>`;
    } else {
      feedback=`<div class="feedback"><h3>${st.correct?'Correct':'Not quite'}</h3>
        <p><b>PDF answer:</b> ${(q.correctLetters||[]).map(L=>choiceText(q,L)).join('; ')}</p>
        <div class="pdf"><b>Professor Messer explanation</b><p>${esc(q.pdfExplanation)}</p>
        ${(q.pdfChoiceNotes||[]).map((n,i)=>n?`<div class="choice"><b>${letters[i]}. ${esc(q.options[i])}</b><br>${esc(n)}</div>`:'').join('')}</div>
        <div class="review"><strong>ChatGPT review: ${esc(q.chatgptVerdict)}</strong><p>${esc(q.chatgptReview)}</p></div></div>`;
    }
  }

  $('app').innerHTML=`<div class="qcard">
    <div class="meta"><span>Question ${pos+1} of ${arr.length}</span><span>${esc(q.id)} · Practice Exam A</span></div>
    <h2>${esc(q.question)}</h2>${body}${feedback}
    <div class="nav"><button type="button" id="prev" ${pos===0?'disabled':''}>← Previous</button>
    <button type="button" class="primary" id="next">${pos===arr.length-1?'Finish':'Next →'}</button></div></div>`;

  if(q.type==='pbq'&&!st){
    $('submitPBQ').addEventListener('click',()=>{
      const sels=[...document.querySelectorAll('[data-p]')], answers=sels.map(x=>x.value);
      if(answers.some(x=>!x)){ alert('Please answer every part first.'); return; }
      const ok=answers.every((x,i)=>x===q.parts[i][1]);
      state[q.id]={answers,correct:ok}; save(); render();
    });
  }
  if(q.type!=='pbq'&&!st){
    const multi=(q.answerIndices||[]).length>1;
    document.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>{
      const i=Number(b.dataset.o);
      if(multi){
        tempSel.includes(i) ? tempSel=tempSel.filter(x=>x!==i) : tempSel.push(i);
        b.classList.toggle('selected');
      } else {
        state[q.id]={answers:[i],correct:(q.answerIndices||[]).includes(i)};
        save(); render();
      }
    }));
    if(multi) $('submitMulti').addEventListener('click',()=>{
      if(!tempSel.length){ alert('Select at least one answer.'); return; }
      const a=[...tempSel].sort((x,y)=>x-y), c=[...(q.answerIndices||[])].sort((x,y)=>x-y);
      state[q.id]={answers:a,correct:JSON.stringify(a)===JSON.stringify(c)};
      tempSel=[]; save(); render();
    });
  }
  $('prev').addEventListener('click',()=>{ if(pos>0){pos--;tempSel=[];render();} });
  $('next').addEventListener('click',()=>{
    if(pos<active().length-1){pos++;tempSel=[];render();}
    else alert('You reached the end of Practice Exam A.');
  });
  updateStats();
}

$('reset').addEventListener('click',()=>{
  if(confirm('Reset all Practice Exam A progress?')){
    try{localStorage.removeItem(KEY);}catch(e){}
    state={}; order=BANK.map((_,i)=>i); pos=0; missedOnly=false; tempSel=[];
    $('missedBtn').textContent='Review missed only'; render();
  }
});
$('shuffle').addEventListener('click',()=>{ order=[...order].sort(()=>Math.random()-.5); pos=0; tempSel=[]; render(); });
$('missedBtn').addEventListener('click',()=>{
  missedOnly=!missedOnly;
  $('missedBtn').textContent=missedOnly?'Show all questions':'Review missed only';
  pos=0; tempSel=[]; render();
});
render();
</script></body></html>
