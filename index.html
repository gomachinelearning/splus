category. Some categories may be used more than once.", "choices": ["Technical", "Managerial", "Operational", "Physical"], "parts": [["A guard checks the identification of all visitors", "Operational"], ["All returns must be approved by a Vice President", "Managerial"], ["A generator is used during a power outage", "Physical"], ["Building doors can be unlocked with an access card", "Physical"], ["System logs are transferred automatically to a SIEM", "Technical"]], "chatgptVerdict": "Agree", "chatgptReview": "I agree with the PDF classifications."}, {"id": "A4", "exam": "A", "type": "pbq", "question": "Match the appropriate authentication factor to each description. Each authentication factor will be used once.", "choices": ["Somewhere you are", "Something you have", "Something you are", "Something you know"], "parts": [["During the login process, your phone receives a text message with a one-time passcode", "Something you have"], ["You enter your PIN to make a deposit into an ATM", "Something you know"], ["You can use your fingerprint to unlock the door to the data center", "Something you are"], ["Your login will not work unless you are connected to the VPN", "Somewhere you are"]], "chatgptVerdict": "Agree", "chatgptReview": "I agree with all four authentication-factor mappings."}, {"id": "A5", "exam": "A", "type": "pbq", "question": "Configure the following stateful firewall rules: Block HTTP sessions between the Web Server and the Database Server; Allow the Storage Server to transfer files to the Video Server over HTTPS; Allow the Management Server to use a secure terminal on the File Server.", "choices": ["10.1.1.2 → 10.2.1.20 | TCP 80 | Block", "10.2.1.33 → 10.1.1.7 | TCP 443 | Allow", "10.2.1.47 → 10.1.1.3 | TCP 22 | Allow"], "parts": [["Rule 1 — HTTP: Web Server to Database Server", "10.1.1.2 → 10.2.1.20 | TCP 80 | Block"], ["Rule 2 — HTTPS: Storage Server to Video Server", "10.2.1.33 → 10.1.1.7 | TCP 443 | Allow"], ["Rule 3 — Secure terminal: Management Server to File Server", "10.2.1.47 → 10.1.1.3 | TCP 22 | Allow"]], "chatgptVerdict": "Agree", "chatgptReview": "I agree with all three firewall rules: HTTP uses TCP 80, HTTPS uses TCP 443, and SSH uses TCP 22, with the source and destination addresses shown in the PDF diagram."}, {"id": "A6", "exam": "A", "question": "A company has hired a third-party to gather information about the company’s servers and data. This third-party will not have direct access to the company's internal network, but they can gather information from any other source. Which of the following would BEST describe this approach?", "options": ["Vulnerability scanning                                 Quick", "Passive reconnaissance", "Supply chain analysis                                  The Details: 43", "Regulatory audit ❍ D. Regulatory audit"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "Passive reconnaissance focuses on gathering as much information from open sources such as social media, corporate websites, and business organizations.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Some active reconnaissance tests will query systems directly to see if a vulnerability currently exists.", "Passive reconnaissance focuses on gathering as much information from open sources such as social media, corporate websites, and business organizations.", "A supply chain analysis will examine the security associated with a supplier, and the analysis will not provide any information regarding a company's own servers and data.", "A regulatory audit is a detailed security analysis based on existing laws or private guidelines. A regulatory audit commonly requires access to internal systems and data."]}, {"id": "A7", "exam": "A", "question": "A company's email server has received an email from a third-party, but the origination server does not match the list of authorized devices. Which of the following would determine the disposition of this message? Quick", "options": ["SPF", "NAC", "DMARC", "DKIM"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "DMARC (Domain-based Message Authentication Reporting and Conformance) specifies the disposition of spam emails. The legitimate owner of the originating email domain can choose to have these messages accepted, sent to a spam folder, or rejected.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["SPF (Sender Policy Framework) is a list of all authorized mail servers for a specific domain. All legitimate emails would be sent from one of the servers listed in the SPF configuration.", "NAC (Network Access Control) is a way to limit network access to only authorized users. NAC is not commonly used to manage the transfer of email messages.", "DMARC (Domain-based Message Authentication Reporting and Conformance) specifies the disposition of spam emails. The legitimate owner of the originating email domain can choose to have these messages accepted, sent to a spam folder, or rejected.", "DKIM (Domain Keys Identified Mail) provides a way to validate all digitally signed messages from a specific email server. DKIM does not determine how the receiving server categorizes these digitally signed messages."]}, {"id": "A8", "exam": "A", "question": "Which of these threat actors would be MOST likely to attack systems for direct financial gain?", "options": ["Organized crime                                        Quick", "Hacktivist", "Nation state                                           The Details: 45", "Shadow IT"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "An organized crime actor is motivated by money, and their hacking objectives are usually based around objectives that can be easily exchanged for financial capital.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["An organized crime actor is motivated by money, and their hacking objectives are usually based around objectives that can be easily exchanged for financial capital.", "A hacktivist is focused on a political agenda and not commonly on a financial gain.", "Nation states are already well funded, and their primary objective is not usually based on revenue or income.", "Shadow IT describes part of the organization that works around the existing IT department to build their own applications and infrastructure."]}, {"id": "A9", "exam": "A", "question": "A security administrator has examined a server recently compromised by an attacker, and has determined the system was exploited due to a known operating system vulnerability. Which of the following would BEST describe this finding? Quick", "options": ["Root cause analysis", "E-discovery", "Risk appetite", "Data subject"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "The goal of a root cause analysis is to explain the ultimate cause of an incident. Once the cause is known, it becomes easier to protect against similar attacks in the future.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["The goal of a root cause analysis is to explain the ultimate cause of an incident. Once the cause is known, it becomes easier to protect against similar attacks in the future.", "E-discovery relates to the collection, preparation, review, interpretation, and production of electronic documents. E-discovery itself is not involved with the research and determination of an attack's root cause.", "A risk appetite describes the amount of risk an organization is willing to take before taking any action to reduce that risk. Risk appetite is not part of a root cause analysis.", "A data subject describes any information relating to an identified or identifiable natural person, especially when describing or managing private information about the subject."]}, {"id": "A10", "exam": "A", "question": "A city is building an ambulance service network for emergency medical dispatching. Which of the following should have the highest priority?", "options": ["Integration costs                                       Quick", "Patch availability", "System availability                                     The Details: 47", "Power usage ❍ D. Power usage"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "Requests to emergency services are often critical in nature, and it's important for a dispatching system to always be available when a call is made.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["When lives are on the line, the cost is not commonly the most important aspect of a system integration.", "Although it's important to always keep systems patched, it's more important that a life saving service be available to those who might need it.", "Requests to emergency services are often critical in nature, and it's important for a dispatching system to always be available when a call is made.", "Power usage is not usually the most important consideration when building a critical healthcare and emergency service infrastructure."]}, {"id": "A11", "exam": "A", "question": "A system administrator receives a text alert when access rights are changed on a database containing private customer information. Which of the following would describe this alert? Quick", "options": ["Maintenance window", "Attestation and acknowledgment", "Automation                                              The Details: 48", "External audit ❍ D. External audit"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "Automation ensures that compliance checks can be performed on a regular basis without the need for human intervention. This can be especially useful to provide alerts when a configuration change causes an organization to be out of compliance.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A maintenance window describes the scheduling associated with the change control process. Systems and services generally have limited availability during a maintenance window.", "With compliance, the process of attestation and acknowledgment is the final verification of the formal compliance documentation. An alert from an automated process would not qualify as attestation.", "Automation ensures that compliance checks can be performed on a regular basis without the need for human intervention. This can be especially useful to provide alerts when a configuration change causes an organization to be out of compliance.", "An external audit can be a valuable tool for verifying the compliance process, but an automated alert from a monitoring system would not be part of an external audit."]}, {"id": "A12", "exam": "A", "question": "A security administrator is concerned about the potential for data exfiltration using external storage drives. Which of the following would be the BEST way to prevent this method of data exfiltration?", "options": ["Create an operating system security policy     Quick to block the use of removable media            Answer: 33", "Monitor removable media usage in               The Details: 49 host-based firewall logs", "Only allow applications that do not use removable media", "Define a removable media block rule in the UTM"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "the use of removable media Removable media uses hot-pluggable interfaces such as USB to connect storage drives. A security policy in the operating system can prevent any files from being written to a removable drive.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["the use of removable media Removable media uses hot-pluggable interfaces such as USB to connect storage drives. A security policy in the operating system can prevent any files from being written to a removable drive.", "A host-based firewall monitors traffic flows and does not commonly log hardware or USB drive access.", "File storage access options are not associated with applications, so it’s not possible to allow based on external storage drive usage.", "A UTM (Unified Threat Manager) watches traffic flows across the network and does not commonly manage the storage options on individual computers."]}, {"id": "A13", "exam": "A", "question": "A company creates a standard set of government reports each calendar quarter. Which of the following would describe this type of data?", "options": ["Data in use                                         Quick", "Obfuscated", "Trade secrets                                       The Details: 50", "Regulated ❍ D. Regulated"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "Reports and information created for governmental use are regulated by laws regarding the disclosure of certain types of data.", "chatgptVerdict": "Agree, with wording caveat", "chatgptReview": "Regulated is the intended answer in this exam context. The wording is broad because not every document created for government use is automatically regulated, but the other choices fit less well.", "pdfChoiceNotes": ["Data in use describes information actively processing in the memory of a system, such as system RAM, CPU registers, or CPU cache. Government reports are static documents and are not actively being processed.", "Obfuscation describes the modification of data to make something understandable into something very difficult to understand. Information contained in a government report is relatively easy to understand and would not be considered obfuscated data.", "Trade secrets are the private details a company uses as part of their normal business processes, and these trade secrets are not shared with any other organization or business.", "Reports and information created for governmental use are regulated by laws regarding the disclosure of certain types of data."]}, {"id": "A14", "exam": "A", "question": "An insurance company has created a set of policies to handle data breaches. The security team has been given this set of requirements based on these policies: • Access records from all devices must be saved and archived • Any data access outside of normal working hours must be immediately reported • Data access must only occur inside of the country • Access logs and audit reports must be created from a single database Which of the following should be implemented by the security team to meet these requirements? (Select THREE)", "options": ["Restrict login access by IP address and         Quick GPS location                                    Answer: 33", "Require government-issued identification        The Details: 51 ❍ B. Require government-issued identification        The Details: 51 during the onboarding process", "Add additional password complexity for accounts that access data", "Conduct monthly permission auditing", "Consolidate all logs on a SIEM", "Archive the encryption keys of all disabled accounts", "Enable time-of-day restrictions on the authentication server"], "correctLetters": ["A", "E"], "answerIndices": [0, 4], "pdfExplanation": "E. Consolidate all logs on a SIEM, and G. Enable time-of-day restrictions on the authentication server Adding location-based policies will prevent direct data access from outside of the country. Saving log information from all devices and creating audit reports from a single database can be implemented through the use of a SIEM (Security Information and Event Manager). Adding a check for the time-of-day will report any access that occurs during non-working hours. Practice Exam A - Answers                        51", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["E. Consolidate all logs on a SIEM, and G. Enable time-of-day restrictions on the authentication server Adding location-based policies will prevent direct data access from outside of the country. Saving log information from all devices and creating audit reports from a single database can be implemented through the use of a SIEM (Security Information and Event Manager). Adding a check for the time-of-day will report any access that occurs during non-working hours. Practice Exam A - Answers                        51", "onboarding process Requiring proper identification is always a good idea, but it’s not one of the listed requirements.", "Additional password complexity is another good best practice, but it’s not part of the provided requirements.", "No requirements for ongoing auditing were included in the requirements, but ongoing auditing is always an important consideration.", "E. Consolidate all logs on a SIEM, and G. Enable time-of-day restrictions on the authentication server Adding location-based policies will prevent direct data access from outside of the country. Saving log information from all devices and creating audit reports from a single database can be implemented through the use of a SIEM (Security Information and Event Manager). Adding a check for the time-of-day will report any access that occurs during non-working hours. Practice Exam A - Answers                        51", "If an account is disabled, there may still be encrypted data that needs to be recovered later. Archiving the encryption keys will allow access to that data after the account is no longer in use.", ""]}, {"id": "A15", "exam": "A", "question": "A security engineer is viewing this record from the firewall logs: UTC 04/05/2023 03:09:15809   AV Gateway Alert 136.127.92.171 80 -\u003e 10.16.10.14 60818 Gateway Anti-Virus Alert: XPACK.A_7854 (Trojan) blocked. Which of the following can be observed from this log information?", "options": ["The victim's IP address is 136.127.92.171              Quick", "A download was blocked from a web server", "A botnet DDoS attack was blocked                       The Details: 53", "The Trojan was blocked, but the file was not ❍ D. The Trojan was blocked, but the file was not"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "A traffic flow from a web server port number (80) to a device port (60818) indicates that this traffic flow originated on port 80 of the web server. A file download is one of the most common ways to deliver a Trojan, and this log entry shows that the file containing the XPACK.A_7854 Trojan was blocked.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["The format for this log entry uses an arrow to differentiate between the attacker and the victim. The attacker IP address is 136.127.92.171, and the victim’s IP address is 10.16.10.14.", "A traffic flow from a web server port number (80) to a device port (60818) indicates that this traffic flow originated on port 80 of the web server. A file download is one of the most common ways to deliver a Trojan, and this log entry shows that the file containing the XPACK.A_7854 Trojan was blocked.", "A botnet attack would not commonly include a Trojan horse as part of a distributed denial of service (DDoS) attack.", "A Trojan horse attack involves malware that is disguised as legitimate software. The Trojan malware and the file are the same entity, so there isn’t a way to decouple the malware from the file."]}, {"id": "A16", "exam": "A", "question": "A user connects to a third-party website and receives this message:  Your connection is not private. NET::ERR_CERT_INVALID  Which of the following attacks would be the MOST likely reason for this message? Quick", "options": ["Brute force", "DoS", "On-path", "Deauthentication"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "An on-path attack is often associated with a third-party who is actively intercepting network traffic. This entity in the middle would not be able to provide a valid SSL certificate for a third-party website, and this error would appear in the browser as a warning.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A brute force attack is commonly associated with password hacks. Brute force attacks would not cause the certificate on a website to be invalid.", "A DoS (Denial of Service) attack would prevent communication to a server and most likely provide a timeout error. This error is not related to a service availability issue.", "An on-path attack is often associated with a third-party who is actively intercepting network traffic. This entity in the middle would not be able to provide a valid SSL certificate for a third-party website, and this error would appear in the browser as a warning.", "Deauthentication attacks are commonly associated with wireless networks, and they usually cause disconnects and lack of connectivity. The error message in this example does not appear to be associated with a network outage or disconnection."]}, {"id": "A17", "exam": "A", "question": "Which of the following would be the BEST way to provide a website login using existing credentials from a third-party site?", "options": ["Federation                                             Quick", "802.1X", "EAP                                                    The Details: 55", "SSO"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "Federation would allow members of one organization to authenticate using the credentials of another organization.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Federation would allow members of one organization to authenticate using the credentials of another organization.", "802.1X is a useful authentication protocol, but it needs additional functionality to authenticate across multiple user databases.", "EAP (Extensible Authentication Protocol) is an authentication framework commonly associated with network access control. EAP by itself does not provide the federation needed to authenticate users to a third-party access database.", "SSO (Single Sign-On) describes the process of enabling a single authentication to grant access to many different network services. Obtaining login credentials from a third-party access database does not describe the process used by SSO."]}, {"id": "A18", "exam": "A", "question": "A system administrator is working on a contract that will specify a minimum required uptime for a set of Internet- facing firewalls. The administrator needs to know how often the firewall hardware is expected to fail between repairs. Which of the following would BEST describe this information?", "options": ["MTBF                                                   Quick", "RTO", "MTTR                                                   The Details: 56", "RPO"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "The MTBF (Mean Time Between Failures) is a prediction of how often a repairable system will fail.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["The MTBF (Mean Time Between Failures) is a prediction of how often a repairable system will fail.", "RTO (Recovery Time Objectives) define a timeframe needed to restore a particular service level.", "MTTR (Mean Time to Restore) is the amount of time it takes to repair a component.", "RPO (Recovery Point Objective) describes the minimum data or operational state required to categorize a system as recovered."]}, {"id": "A19", "exam": "A", "question": "An attacker calls into a company’s help desk and pretends to be the director of the company’s manufacturing department. The attacker states that they have forgotten their password and they need to have the password reset quickly for an important meeting. What kind of attack would BEST describe this phone call?", "options": ["Social engineering                                     Quick", "Supply chain", "Watering hole                                          The Details: 57", "On-path"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "This social engineering attack uses impersonation to take advantage of authority and urgency principles in an effort to convince someone else to circumvent normal security controls.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["This social engineering attack uses impersonation to take advantage of authority and urgency principles in an effort to convince someone else to circumvent normal security controls.", "A supply chain attack focuses on the equipment or raw materials used to deliver products or services to an organization or user. A call to the help desk would not be categorized as part of the supply chain.", "A watering hole attack uses a third-party site to perform attacks outside of a user's local (and usually more secure) network.", "An on-path attack commonly occurs without any knowledge to the parties involved, and there’s usually no additional notification that an attack is underway. In this question, the attacker contacted the help desk engineer directly."]}, {"id": "A20", "exam": "A", "question": "Two companies have been working together for a number of months, and they would now like to qualify their partnership with a broad formal agreement between both organizations. Which of the following would describe this agreement?", "options": ["SLA                                                    Quick", "SOW", "MOA                                                    The Details: 58", "NDA ❍ D. NDA"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "An MOA (Memorandum of Agreement) is a formal document where both sides agree to a broad set of goals and objectives associated with the partnership.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["An SLA (Service Level Agreement) is commonly provided as a formal contract between two parties that documents the minimum terms for services provided. The SLA often provides very specific requirements and expectations between both parties.", "An SOW (Statement of Work) is a detailed list of items to be completed as part of overall project deliverables. For example, a list of expected job tasks associated with a firewall installation would be documented in an SOW.", "An MOA (Memorandum of Agreement) is a formal document where both sides agree to a broad set of goals and objectives associated with the partnership.", "An NDA (Non-Disclosure Agreement) is a confidentiality agreement between parties. This question did not mention any requirement for privacy or confidentiality."]}, {"id": "A21", "exam": "A", "question": "Which of the following would explain why a company would automatically add a digital signature to each outgoing email message?", "options": ["Confidentiality                                         Quick", "Integrity", "Authentication                                          The Details: 59", "Availability"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "Integrity refers to the trustworthiness of data. A digital signature allows the recipient to confirm that none of the data has been changed since the digital signature was created.", "chatgptVerdict": "Agree, but ambiguous", "chatgptReview": "Integrity is the intended Security+ answer because a digital signature detects modification. However, digital signatures also support origin authentication, so the wording makes Authentication a defensible secondary concept.", "pdfChoiceNotes": ["Confidentiality describes the privacy of data. Encrypting traffic sent over a VPN or encrypting files stored on a flash drive would be an example of data confidentiality.", "Integrity refers to the trustworthiness of data. A digital signature allows the recipient to confirm that none of the data has been changed since the digital signature was created.", "Authentication refers to the process of verifying the identity of an individual or system. A username and password is a common method of authentication, but digital signatures are not commonly used as an authentication method.", "Availability describes the ability of an authorized user to access data. A digital signature does not provide any features associated with the availability of the data."]}, {"id": "A22", "exam": "A", "question": "The embedded OS in a company’s time clock appliance is configured to reset the file system and reboot when a file system error occurs. On one of the time clocks, this file system error occurs during the startup process and causes the system to constantly reboot. Which of the following BEST describes this issue?", "options": ["Memory injection                                        Quick", "Resource consumption", "Race condition                                          The Details: 60", "Malicious update"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "A race condition occurs when two processes occur at similar times, and usually with unexpected results. The file system problem can often be fixed before a reboot, but the reboot is occurring before the fix can be applied. This has created a race condition that results in constant reboots.", "chatgptVerdict": "Agree, as the best available choice", "chatgptReview": "The described timing problem can be treated as a race condition in the choices provided. In ordinary troubleshooting, “boot loop” would be a more direct description, but it is not an option.", "pdfChoiceNotes": ["A memory injection is commonly used by malicious software to add code to the memory of an existing process. The issue in this question was related to a file system error and was not part of a malicious data injection.", "If the time clock was running out of storage space or memory, it would most likely be unusable. In this example, the issue isn’t based on a lack of resources.", "A race condition occurs when two processes occur at similar times, and usually with unexpected results. The file system problem can often be fixed before a reboot, but the reboot is occurring before the fix can be applied. This has created a race condition that results in constant reboots.", "A malicious update occurs when a software patch installs unwanted or unauthorized code. Many attackers will use software patches to install their own malicious code during a software update."]}, {"id": "A23", "exam": "A", "question": "A recent audit has found that existing password policies do not include any restrictions on password attempts, and users are not required to periodically change their passwords. Which of the following would correct these policy issues? (Select TWO)", "options": ["Password complexity                                     Quick", "Password expiration", "Password reuse                                          The Details: 61", "Account lockout", "Password managers"], "correctLetters": ["B", "D"], "answerIndices": [1, 3], "pdfExplanation": "Password expiration would require a password change after the expiration date. An account lockout would disable an account after a predefined number of unsuccessful login attempts.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A complex password would make the password more difficult to brute force, but it would not solve the issues listed in this question.", "Password expiration would require a password change after the expiration date. An account lockout would disable an account after a predefined number of unsuccessful login attempts.", "Maintaining a password history would prevent the reuse of any previous passwords. Restricting password reuse would ensure that a different password is used each time a password change is processed.", "Password expiration would require a password change after the expiration date. An account lockout would disable an account after a predefined number of unsuccessful login attempts.", "A password manager would provide a way to securely store and retrieve passwords, but it would not resolve any issues relating to password expirations or account lockouts."]}, {"id": "A24", "exam": "A", "question": "What kind of security control is associated with a login banner?", "options": ["Preventive                                            Quick", "Deterrent", "Corrective                                            The Details: 62", "Detective ❍ D. Detective", "Compensating", "Directive"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "A deterrent control does not directly stop an attack, but it may discourage an action.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A preventive control physically limits access to a device or area.", "A deterrent control does not directly stop an attack, but it may discourage an action.", "A corrective control can actively work to mitigate any damage.", "A detective control may not prevent access, but it can identify and record any intrusion attempts.", "A compensating security control doesn’t prevent an attack, but it does restore from an attack using other means.", "A directive control is relatively weak control which relies on security compliance from the end users."]}, {"id": "A25", "exam": "A", "question": "An internal audit has discovered four servers that have not been updated in over a year, and it will take two weeks to test and deploy the latest patches. Which of the following would be the best way to quickly             Quick Answer: 33 respond to this situation in the meantime?", "options": ["Purchase cybersecurity insurance                    The Details: 63", "Implement an exception for all data center services", "Move the servers to a protected segment", "Hire a third-party to perform an extensive audit"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "Segmenting the servers to their own protected network would allow for additional security controls while still maintaining the uptime and availability of the systems.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Cybersecurity insurance can help plan for financial issues during a significant attack, but it wouldn't provide any assistance for mitigating potential vulnerabilities during this two week period.", "Security exceptions should be rare, and they should be very specific to a small number of systems. It would be risky to create a broad security exception for systems which are not in-scope for the identified vulnerability.", "Segmenting the servers to their own protected network would allow for additional security controls while still maintaining the uptime and availability of the systems.", "Audits take time, and hiring a third-party to perform an audit takes even longer. By the time a third-party audit was underway, the problematic systems would have already been tested and patched."]}, {"id": "A26", "exam": "A", "question": "A business manager is documenting a set of steps for processing orders if the primary Internet connection fails. Which of these would BEST describe these steps?", "options": ["Platform diversity                                    Quick", "Continuity of operations", "Cold site recovery                                    The Details: 64", "Tabletop exercise ❍ D. Tabletop exercise"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "It's always useful to have an alternative set of processes to handle any type of outage or issue. Continuity of operations planning ensures that the business will continue to operate when these issues occur.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Using different operating systems and platforms can help mitigate issues associated with a single OS, but it wouldn't provide any mitigation if the primary Internet connection was no longer available.", "It's always useful to have an alternative set of processes to handle any type of outage or issue. Continuity of operations planning ensures that the business will continue to operate when these issues occur.", "A cold site takes time to build, and the time and expense associated with a disaster recovery switchover would be extensive. By the time a cold site was enabled, the primary Internet connection may already be restored and many alternative recovery options could have potentially been deployed.", "A tabletop exercise usually consists of a meeting where members of a recovery team or disaster recovery talk through a disaster scenario."]}, {"id": "A27", "exam": "A", "question": "A company would like to examine the credentials of each individual entering the data center building. Which of the following would BEST facilitate this requirement?", "options": ["Access control vestibule                              Quick", "Video surveillance", "Pressure sensors                                      The Details: 65", "Bollards ❍ D. Bollards"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "An access control vestibule is a room designed to restrict the flow of individuals through an area. These are commonly used in high security areas where each person needs to be evaluated and approved before access can be provided.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["An access control vestibule is a room designed to restrict the flow of individuals through an area. These are commonly used in high security areas where each person needs to be evaluated and approved before access can be provided.", "Although video surveillance can assist with monitoring access to a building or room, it doesn't provide a way to validate the credentials of each visitor.", "Pressure sensors are commonly used on doors or windows to detect movement in those devices. However, pressure sensors would not be used to check visitor credentials.", "Bollards and barricades are often used on the exterior of a facility to prevent access to motorized vehicles and channel people through a specific access location."]}, {"id": "A28", "exam": "A", "question": "A company stores some employee information in encrypted form, but other public details are stored as plaintext. Which of the following would BEST describe this encryption strategy?", "options": ["Full-disk                                               Quick", "Record", "Asymmetric                                              The Details: 66", "Key escrow"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "Record-level encryption is commonly used with databases to encrypt individual columns within the database. This would store some information in the database as plaintext and other information as encrypted data.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Full-disk encryption ensures that all data on a storage drive is protected. Full-disk encryption protects all data on the drive, and none of the information would remain as the original plaintext.", "Record-level encryption is commonly used with databases to encrypt individual columns within the database. This would store some information in the database as plaintext and other information as encrypted data.", "Asymmetric encryption uses a public and private key pair to encrypt data. Asymmetric encryption does not store some information as plaintext and other information as encrypted data.", "Key escrow describes the storage and management of decryption keys by a third-party. Key escrow does not determine which data is selected for encryption or the method of encryption."]}, {"id": "A29", "exam": "A", "question": "A company would like to minimize database corruption if power is lost to a server. Which of the following would be the BEST strategy to follow?", "options": ["Encryption                                              Quick", "Off-site backups", "Journaling                                              The Details: 67", "Replication ❍ D. Replication"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "Journaling writes data to a temporary journal before writing the information to the database. If power is lost, the system can recover the last transaction from the journal when power is restored.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Encryption would provide confidentiality of the data, but it would not provide any additional integrity features if power was lost.", "Off-site backups can be used to recover a corrupted database, but this does not minimize or prevent database corruption from occurring.", "Journaling writes data to a temporary journal before writing the information to the database. If power is lost, the system can recover the last transaction from the journal when power is restored.", "Replication is used to create a duplicate copy of data. Although this process does provide a backup, it doesn't add any additional integrity and could still potentially corrupt data if power is lost."]}, {"id": "A30", "exam": "A", "question": "A company is creating a security policy for corporate mobile devices: • All mobile devices must be automatically locked after a predefined time period. • The location of each device needs to be traceable. • All of the user’s information should be completely separate from company data. Which of the following would be the BEST way to establish these security policy rules?", "options": ["Segmentation", "Biometrics                                              Answer: 33", "COPE", "MDM"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "An MDM (Mobile Device Manager) provides a centralized management system for all mobile devices. From this central console, security administrators can set policies for many different types of mobile devices.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Segmentation describes the separation of user data from company data, but the implementation all policies is managed by the MDM.", "Biometrics can be used as another layer of device security, but you need more than biometrics to implement the required security policies in this question.", "A device that is COPE (Corporately Owned and Personally Enabled) is commonly purchased by the corporation and allows the use of the mobile device for both business and personal use. The use of a COPE device does not provide any policy management of the device.", "An MDM (Mobile Device Manager) provides a centralized management system for all mobile devices. From this central console, security administrators can set policies for many different types of mobile devices."]}, {"id": "A31", "exam": "A", "question": "A security engineer runs a monthly vulnerability scan. The scan doesn’t list any vulnerabilities for Windows servers, but a significant vulnerability was announced last week and none of the servers are patched yet. Which of the following best describes this result?", "options": ["Exploit                                                  Quick", "Compensating controls", "Zero-day attack                                          The Details: 69", "False negative"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "A false negative is a result that fails to detect an issue when one actually exists.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["An exploit is an attack against a vulnerability. Vulnerability scans do not commonly attempt to exploit the vulnerabilities that they identify.", "Compensating controls are used to mitigate a vulnerability when an optimal security response may not be available. For example, if a company can't deploy a patch for a vulnerability, they can revoke or limit application access until a patch is provided.", "A zero-day attack focuses on previously unknown vulnerabilities. In this example, the vulnerability scan isn’t an attack, and the vulnerabilities are already known and patches are available.", "A false negative is a result that fails to detect an issue when one actually exists."]}, {"id": "A32", "exam": "A", "question": "An IT help desk is using automation to improve the response time for security events. Which of the following use cases would apply to this process?", "options": ["Escalation                                               Quick", "Guard rails", "Continuous integration                                   The Details: 70", "Resource provisioning ❍ D. Resource provisioning"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "Automation can recognize security events and escalate a security-related ticket to the incident response team without any additional human interaction.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Automation can recognize security events and escalate a security-related ticket to the incident response team without any additional human interaction.", "Guard rails are used by application developers to provide a set of automated validations to user input and behavior. Guard rails are not used by the help desk team.", "Continuous integration and testing provides an automated method of constantly developing, testing, and deploying code. The continuous integration process is not used by the help desk.", "Resource provisioning can be automated during the on-boarding and off-boarding process to quickly create or remove rights and permissions. Resource provisioning is not commonly part of the automation associated with security event notification."]}, {"id": "A33", "exam": "A", "question": "A network administrator would like each user to authenticate with their corporate username and password when connecting to the company's wireless network. Which of the following should the network administrator configure on the wireless access points?", "options": ["WPA3                                                     Quick", "802.1X                                                   Answer: 33", "PSK                                                      The Details: 71 ❍ C. PSK                                                      The Details: 71", "MFA"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "802.1X uses a centralized authentication server, and this allows all users to use their corporate credentials during the login process.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["WPA3 (Wi-Fi Protected Access 3) is an encryption protocol for 802.11 wireless networking. The WPA3 encryption itself does not include the centralized authentication process described in this question.", "802.1X uses a centralized authentication server, and this allows all users to use their corporate credentials during the login process.", "PSK (Pre-Shared Key) is a wireless configuration option that allows everyone on the network to use the same access key or password when connecting to the wireless network. This question requires each person to use unique authentication credentials.", "MFA (Multifactor Authentication) describes the use of multiple types of authentication checks. A username and password is a single factor (something you know), and the use of MFA does not itself require unique username and password credentials for each user."]}, {"id": "A34", "exam": "A", "question": "A company's VPN service performs a posture assessment during the login process. Which of the following mitigation techniques would this describe?", "options": ["Encryption                                               Quick", "Decommissioning", "Least privilege", "Configuration enforcement"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "A posture assessment evaluates the configuration of a system to ensure all configurations and applications are up to date and secure as possible. If a configuration does not meet these standards, the user is commonly provided with options for resolving the issue before proceeding.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Encryption is an important part of a VPN (Virtual Private Network), but the encryption of network data is not related to the posture assessment process.", "It's important to properly manage data during any decommissioning process, but the decommissioning isn't part of the VPN login process.", "Least privilege describes the minimum rights and permissions that would allow an individual to perform their job function. Least privilege is not part of a posture assessment.", "A posture assessment evaluates the configuration of a system to ensure all configurations and applications are up to date and secure as possible. If a configuration does not meet these standards, the user is commonly provided with options for resolving the issue before proceeding."]}, {"id": "A35", "exam": "A", "question": "A user has assigned individual rights and permissions to a file on their network drive. The user adds three additional individuals to have read-only access to the file. Which of the following would describe this access control model?", "options": ["Discretionary                                         Quick", "Mandatory", "Attribute-based", "Role-based"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "Discretionary access control is used in many operating systems, and this model allows the owner of the resource to control who has access.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Discretionary access control is used in many operating systems, and this model allows the owner of the resource to control who has access.", "Mandatory access control allows access based on the security level assigned to an object. Only users with the object’s assigned security level or higher may access the resource.", "Attribute-based access control combines many different parameters to determine if a user has access to a resource.", "Role-based access control assigns rights and permissions based on the role of a user. These roles are usually assigned by group."]}, {"id": "A36", "exam": "A", "question": "A remote user has received a text message with a link to login and confirm their upcoming work schedule. Which of the following would BEST describe this attack?", "options": ["Brute force                                           Quick", "Watering hole                                         Answer: 33", "Typosquatting                                         The Details: 74", "Smishing"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "Smishing, or SMS (Short Message Service) phishing, is a social engineering attack that asks for sensitive information using SMS or text messages.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A brute force attack tries multiple password combinations in an effort to identify the correct authentication details.", "A watering hole attack will infect a third-party site visited by the victim. Watering hole attacks are not commonly associated with received text messages.", "Typosquatting uses a misspelling of a domain name to convince victims they are visiting a legitimate website. The information provided in this question does not provide any specific domain names or links.", "Smishing, or SMS (Short Message Service) phishing, is a social engineering attack that asks for sensitive information using SMS or text messages."]}, {"id": "A37", "exam": "A", "question": "A company is formalizing the design and deployment process used by their application programmers. Which of the following policies would apply?", "options": ["Business continuity                                   Quick", "Acceptable use policy", "Incident response                                     The Details: 75", "Development lifecycle ❍ D. Development lifecycle"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "A formal software development lifecycle defines the specific policies associated with the design, development, testing, deployment, and maintenance of the application development process.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Business continuity plans define the procedures used when the primary business systems are unavailable. The business continuity process is not commonly associated with the application development process.", "An acceptable use policy formally defines the proper use of company assets and technology devices.", "Incident response policies define the procedures to follow when a security incident is identified. Incident response is not part of the application development process", "A formal software development lifecycle defines the specific policies associated with the design, development, testing, deployment, and maintenance of the application development process."]}, {"id": "A38", "exam": "A", "question": "A security administrator has copied a suspected malware executable from a user's computer and is running the program in a sandbox. Which of the following would describe this part of the incident response process?", "options": ["Eradication                                           Quick", "Preparation", "Recovery                                              The Details: 76", "Containment ❍ D. Containment"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "The isolation and containment process prevents malware from spreading and allows the administrator to analyze the operation of the malware without putting any other devices at risk.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["The eradication phase is associated with completely removing malware from a system. This process usually involves removing all data from a system and installing or re-imaging with a known-good operating system.", "The preparation process occurs before a security incident is discovered, and it can include the documentation of communication methods, the compiling of mitigation software, or gathering network and application documentation.", "The recovery phase is associated with the recovery of a system after a security incident. Running malware in a sandbox is not part of the recovery process.", "The isolation and containment process prevents malware from spreading and allows the administrator to analyze the operation of the malware without putting any other devices at risk."]}, {"id": "A39", "exam": "A", "question": "A server administrator at a bank has noticed a decrease in the number of visitors to the bank's website. Additional research shows that users are being directed to a different IP address than the bank's web server. Which of the following would MOST likely describe this attack?", "options": ["Deauthentication                                     Quick", "DDoS", "Buffer overflow                                      The Details: 77", "DNS poisoning ❍ D. DNS poisoning"], "correctLetters": ["D"], "answerIndices": [3], "pdfExplanation": "A DNS poisoning can modify a DNS server to modify the IP address provided during the name resolution process. If an attacker modifies the DNS information, they can direct client computers to any destination IP address.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Deauthentication attacks are commonly associated with wireless networks. The deauthentication attack is used to remove devices from the wireless network, and it does not commonly redirect clients to a different website.", "A DDoS (Distributed Denial of Service) is used by attackers to cause services to be unavailable. In this example, the bank's website is operational but clients are not resolving the correct IP address.", "Buffer overflows are associated with application attacks and can cause applications to crash or act in unexpected ways. A buffer overflow would not commonly redirect clients to a different website IP address.", "A DNS poisoning can modify a DNS server to modify the IP address provided during the name resolution process. If an attacker modifies the DNS information, they can direct client computers to any destination IP address."]}, {"id": "A40", "exam": "A", "question": "Which of the following considerations are MOST commonly associated with a hybrid cloud model?", "options": ["Microservice outages                                 Quick", "IoT support                                          Answer: 33", "Network protection mismatches                        The Details: 78 ❍ C. Network protection mismatches                        The Details: 78", "Containerization backups"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "A hybrid cloud includes more than one private or public cloud. This adds additional complexity to the overall infrastructure, and it's common to inadvertently apply different authentication options and user permissions across multiple cloud providers.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["Microservices are used to create a scalable and resilient application instance. However, the availability of a microservice is not specific to a hybrid cloud model.", "IoT (Internet of Things) support is available in many cloud infrastructure models, and this would not be specific to a hybrid cloud.", "A hybrid cloud includes more than one private or public cloud. This adds additional complexity to the overall infrastructure, and it's common to inadvertently apply different authentication options and user permissions across multiple cloud providers.", "Containerization provides an efficient method of deploying application instances, but the use and backup of these containers is not specific to a hybrid cloud infrastructure."]}, {"id": "A41", "exam": "A", "question": "A company hires a large number of seasonal employees, and their system access should normally be disabled when the employee leaves the company. The security administrator would like to verify that their systems cannot be accessed by any of the former employees. Which of the following would be the BEST way to provide this verification? Quick", "options": ["Confirm that no unauthorized accounts have        Answer: 33 administrator access", "Validate the account lockout policy", "Validate the offboarding processes and procedures", "Create a report that shows all authentications for a 24-hour period"], "correctLetters": ["C"], "answerIndices": [2], "pdfExplanation": "The disabling of an employee account is commonly part of the offboarding process. One way to validate an offboarding policy is to perform an audit of all accounts and compare active accounts with active employees.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["It’s always a good idea to periodically audit administrator accounts, but this audit won’t provide any validation that all former employee accounts have been disabled.", "Account lockouts occur when a number of invalid authentication attempts have been made to a valid account. Disabled accounts would not be locked out because they are not currently valid accounts.", "The disabling of an employee account is commonly part of the offboarding process. One way to validate an offboarding policy is to perform an audit of all accounts and compare active accounts with active employees.", "A list of all authentications would be quite large, and it would not be obvious to see which authentications were made with valid accounts and which authentications were made with former employee accounts."]}, {"id": "A42", "exam": "A", "question": "Which of the following is used to describe how cautious an organization might be to taking a specific risk?", "options": ["Risk appetite                                           Quick", "Risk register", "Risk transfer                                           The Details: 80", "Risk reporting"], "correctLetters": ["A"], "answerIndices": [0], "pdfExplanation": "A risk appetite is a broad description of how much risk-taking is deemed acceptable. An organization's risk appetite posture might be conservative, or they might be more expansionary and willing to take additional risks.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["A risk appetite is a broad description of how much risk-taking is deemed acceptable. An organization's risk appetite posture might be conservative, or they might be more expansionary and willing to take additional risks.", "A risk register identifies and documents the risks associated with each step of a project plan. A risk register is not designed to describe an organization's level of caution associated with each risk.", "Some organizations will transfer their risk to a third-party. For example, many organizations will purchase cybersecurity insurance to minimize the financial impact of a cybersecurity event.", "Risk reporting is the formal process of identifying risk and documenting all details associated with the risk. These reports are commonly designed for the decision making process by the senior management of an organization."]}, {"id": "A43", "exam": "A", "question": "A technician is applying a series of patches to fifty web servers during a scheduled maintenance window. After patching and rebooting the first server, the web service fails with a critical error. Which of the following should the technician do NEXT?", "options": ["Contact the stakeholders regarding the outage           Quick", "Follow the steps listed in the backout plan", "Test the upgrade process in the lab                     The Details: 81", "Evaluate the impact analysis associated with ❍ D. Evaluate the impact analysis associated with the change"], "correctLetters": ["B"], "answerIndices": [1], "pdfExplanation": "The backout plan associated with the change control process provides information on reverting to the previous configuration if an unrecoverable error is found during the change.", "chatgptVerdict": "Agree", "chatgptReview": "I independently reviewed the stem and choices and agree that the PDF answer is the best answer among the options provided.", "pdfChoiceNotes": ["The stakeholders don't commonly require a detailed notification of every step during the maintenance window. The final disposition of the change can be communicated to the stakeholders after the maintenance window has concluded.", "The backout plan associated with the change control process provides information on reverting to the previous configuration if an unrecoverable error is found during the change.", "The
