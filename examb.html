const KEY='secplusExamB90_rebuilt_v2';
let state={};
try { state=JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e) { state={}; }
let order=BANK.map((_,i)=>i), pos=0, missedOnly=false, tempSel=[];
const NAVKEY='secplusExamB90_nav_v3';
try {
  const nav=JSON.parse(localStorage.getItem(NAVKEY)||'{}');
  if(Array.isArray(nav.order) && nav.order.length===BANK.length) order=nav.order;
  if(Number.isInteger(nav.pos) && nav.pos>=0) pos=nav.pos;
  if(typeof nav.missedOnly==='boolean') missedOnly=nav.missedOnly;
} catch(e) {}
function saveNav(){ try { localStorage.setItem(NAVKEY,JSON.stringify({order,pos,missedOnly})); } catch(e) {} }

const $=id=>document.getElementById(id);
const letters='ABCDEFG';
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function save(){ try { localStorage.setItem(KEY,JSON.stringify(state)); } catch(e) {} }
function active(){
  return missedOnly ? order.filter(i=>state[BANK[i].id] && !state[BANK[i].id].correct) : order;
}
function updateStats(){
  const vals=Object.values(state), a=vals.length, c=vals.filter(x=>x.correct).length;
  $('answered').textContent=a;
  $('correct').textContent=c;
  $('missed').textContent=a-c;
  $('accuracy').textContent=a ? Math.round(c/a*100)+'%' : '0%';
  $('bar').style.width=(a/BANK.length*100)+'%';
}
function choiceText(q,L){
  const i=letters.indexOf(L);
  return i>=0 && q.options ? `${L}. ${esc(q.options[i])}` : L;
}
function render(){
  const arr=active();
  if(!arr.length){
    $('app').innerHTML='<div class="qcard"><h2>No questions to show.</h2><p>Turn off “Review missed only” or answer some questions first.</p></div>';
    updateStats(); return;
  }
  pos=Math.max(0,Math.min(pos,arr.length-1));
  saveNav();
  const q=BANK[arr[pos]], st=state[q.id];
  let body='';

  if(q.type==='pbq'){
    body=(q.parts||[]).map((p,i)=>`
      <div class="pbqrow">
        <label>${esc(p[0])}</label>
        <select data-p="${i}" ${st?'disabled':''}>
          <option value="">Select…</option>
          ${(q.choices||[]).map(x=>`<option ${st&&st.answers&&st.answers[i]===x?'selected':''}>${esc(x)}</option>`).join('')}
        </select>
      </div>`).join('');
    if(!st) body+='<button class="primary" id="submitPBQ" type="button">Submit answer</button>';
  } else {
    const multi=(q.answerIndices||[]).length>1;
    if(multi&&!st) body+='<p class="note">Select all that apply, then click Submit answer.</p>';
    body+=(q.options||[]).map((o,i)=>{
      let cls='opt', selected=st&&st.answers.includes(i);
      if(!st&&tempSel.includes(i)) cls+=' selected';
      if(st&&selected) cls+=(q.answerIndices||[]).includes(i)?' correct':' wrong';
      else if(st&&(q.answerIndices||[]).includes(i)) cls+=' correct';
      return `<button type="button" class="${cls}" data-o="${i}" ${st?'disabled':''}><span class="letter">${letters[i]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    if(multi&&!st) body+='<button class="primary" id="submitMulti" type="button">Submit answer</button>';
  }

  let feedback='';
  if(st){
    if(q.type==='pbq'){
      feedback=`<div class="feedback"><h3>${st.correct?'Correct':'Not quite'}</h3>
        <div class="pdf"><strong>PDF answer</strong>${(q.parts||[]).map(p=>`<div class="choice"><b>${esc(p[0])}</b><br>${esc(p[1])}</div>`).join('')}</div>
        <div class="review"><strong>ChatGPT review: ${esc(q.chatgptVerdict)}</strong><p>${esc(q.chatgptReview)}</p></div></div>`;
    } else {
      feedback=`<div class="feedback"><h3>${st.correct?'Correct':'Not quite'}</h3>
        <p><b>PDF answer:</b> ${(q.correctLetters||[]).map(L=>choiceText(q,L)).join('; ')}</p>
        <div class="pdf"><b>Professor Messer explanation</b><p>${esc(q.pdfExplanation)}</p>
        ${(q.pdfChoiceNotes||[]).map((n,i)=>n?`<div class="choice"><b>${letters[i]}. ${esc(q.options[i])}</b><br>${esc(n)}</div>`:'').join('')}</div>
        <div class="review"><strong>ChatGPT review: ${esc(q.chatgptVerdict)}</strong><p>${esc(q.chatgptReview)}</p></div></div>`;
    }
  }

  $('app').innerHTML=`<div class="qcard">
    <div class="meta"><span>Question ${pos+1} of ${arr.length}</span><span>${esc(q.id)} · Practice Exam B</span></div>
    <h2>${esc(q.question)}</h2>${body}${feedback}
    <div class="nav"><button type="button" id="prev" ${pos===0?'disabled':''}>← Previous</button>
    <button type="button" class="primary" id="next">${pos===arr.length-1?'Finish':'Next →'}</button></div></div>`;

  if(q.type==='pbq'&&!st){
    $('submitPBQ').addEventListener('click',()=>{
      const sels=[...document.querySelectorAll('[data-p]')], answers=sels.map(x=>x.value);
      if(answers.some(x=>!x)){ alert('Please answer every part first.'); return; }
      const ok=q.id==='B2'
        ? [answers.slice(0,3),answers.slice(3,5)].every((group,j)=>{
            const expected=(j===0?q.parts.slice(0,3):q.parts.slice(3,5)).map(p=>p[1]);
            return group.length===new Set(group).size && group.every(x=>expected.includes(x));
          })
        : answers.every((x,i)=>x===q.parts[i][1]);
      state[q.id]={answers,correct:ok}; save(); render();
    });
  }
  if(q.type!=='pbq'&&!st){
    const multi=(q.answerIndices||[]).length>1;
    document.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>{
      const i=Number(b.dataset.o);
      if(multi){
        tempSel.includes(i) ? tempSel=tempSel.filter(x=>x!==i) : tempSel.push(i);
        b.classList.toggle('selected');
      } else {
        state[q.id]={answers:[i],correct:(q.answerIndices||[]).includes(i)};
        save(); render();
      }
    }));
    if(multi) $('submitMulti').addEventListener('click',()=>{
      if(!tempSel.length){ alert('Select at least one answer.'); return; }
      const a=[...tempSel].sort((x,y)=>x-y), c=[...(q.answerIndices||[])].sort((x,y)=>x-y);
      state[q.id]={answers:a,correct:JSON.stringify(a)===JSON.stringify(c)};
      tempSel=[]; save(); render();
    });
  }
  $('prev').addEventListener('click',()=>{ if(pos>0){pos--;tempSel=[];saveNav();render();} });
  $('next').addEventListener('click',()=>{
    if(pos<active().length-1){pos++;tempSel=[];saveNav();render();}
    else alert('You reached the end of Practice Exam B.');
  });
  updateStats();
}

$('reset').addEventListener('click',()=>{
  if(confirm('Reset all Practice Exam B progress?')){
    try{localStorage.removeItem(KEY);localStorage.removeItem(NAVKEY);}catch(e){}
    state={}; order=BANK.map((_,i)=>i); pos=0; missedOnly=false; tempSel=[]; saveNav();
    $('missedBtn').textContent='Review missed only'; render();
  }
});
$('shuffle').addEventListener('click',()=>{ order=[...order].sort(()=>Math.random()-.5); pos=0; tempSel=[]; saveNav(); render(); });
$('missedBtn').addEventListener('click',()=>{
  missedOnly=!missedOnly;
  $('missedBtn').textContent=missedOnly?'Show all questions':'Review missed only';
  pos=0; tempSel=[]; saveNav(); render();
});
$('missedBtn').textContent=missedOnly?'Show all questions':'Review missed only';
window.addEventListener('pagehide',saveNav);
render();
</script></body></html>
